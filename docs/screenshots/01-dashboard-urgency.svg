<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- App Header / Navbar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="50" cy="35" r="16" fill="#059669" />
  <text x="76" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#ffffff">Expiry<tspan fill="#10b981">Guard</tspan></text>
  <rect x="180" y="24" width="46" height="22" rx="4" fill="#064e3b" />
  <text x="190" y="39" font-family="sans-serif" font-weight="700" font-size="11" fill="#34d399">V1.0</text>

  <!-- Nav Tabs -->
  <rect x="420" y="16" width="360" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="445" y="40" font-family="sans-serif" font-size="13" fill="#94a3b8">Overview</text>
  <rect x="525" y="20" width="115" height="30" rx="8" fill="#334155" />
  <text x="540" y="40" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">Kitchen Stock</text>
  <circle cx="625" cy="35" r="7" fill="#f59e0b" />
  <text x="622" y="39" font-family="sans-serif" font-weight="800" font-size="10" fill="#ffffff">4</text>
  <text x="655" y="40" font-family="sans-serif" font-size="13" fill="#94a3b8">Cook-First</text>
  <text x="735" y="40" font-family="sans-serif" font-size="13" fill="#94a3b8">Impact</text>

  <!-- CTA Button -->
  <rect x="1050" y="16" width="110" height="38" rx="10" fill="#059669" />
  <text x="1072" y="40" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">+ Add Item</text>

  <!-- Top Metric Cards -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="250" height="90" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" font-family="sans-serif" font-size="12" fill="#94a3b8">Total Active Items</text>
    <text x="20" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#ffffff">11 Items</text>

    <rect x="275" y="0" width="250" height="90" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
    <text x="295" y="32" font-family="sans-serif" font-size="12" fill="#f59e0b">Urgent Attention (&lt;72h)</text>
    <text x="295" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#f59e0b">4 Urgent</text>

    <rect x="550" y="0" width="250" height="90" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="570" y="32" font-family="sans-serif" font-size="12" fill="#34d399">Inventory Retail Value</text>
    <text x="570" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#34d399">$58.41</text>

    <rect x="825" y="0" width="255" height="90" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="845" y="32" font-family="sans-serif" font-size="12" fill="#94a3b8">Zero-Waste Streak</text>
    <text x="845" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#38bdf8">12 Days Active</text>
  </g>

  <!-- Filter & Search Bar -->
  <rect x="60" y="210" width="1080" height="60" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="85" y="246" font-family="sans-serif" font-size="14" fill="#64748b">🔍 Search items, storage tips, categories... (Press '/' to focus)</text>
  <rect x="800" y="222" width="160" height="36" rx="8" fill="#0f172a" />
  <text x="820" y="245" font-family="sans-serif" font-size="12" fill="#cbd5e1">All Locations ▾</text>
  <rect x="970" y="222" width="150" height="36" rx="8" fill="#0f172a" />
  <text x="985" y="245" font-family="sans-serif" font-size="12" fill="#cbd5e1">Sort: Urgent ▾</text>

  <!-- Inventory Cards Grid -->
  <g transform="translate(60, 290)">
    <!-- Card 1: Urgent Spinach -->
    <rect x="0" y="0" width="345" height="230" rx="18" fill="url(#cardGrad)" stroke="#ef4444" stroke-opacity="0.7" stroke-width="1.5" />
    <text x="25" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Baby Spinach</text>
    <text x="25" y="62" font-family="sans-serif" font-size="12" fill="#94a3b8">1 container (200g) • ❄️ fridge</text>
    <rect x="220" y="22" width="105" height="24" rx="12" fill="#450a0a" stroke="#dc2626" stroke-width="1" />
    <text x="230" y="38" font-family="sans-serif" font-size="10" font-weight="700" fill="#fca5a5">Expires Tomorrow</text>
    
    <rect x="25" y="80" width="295" height="30" rx="8" fill="#0f172a" />
    <text x="35" y="100" font-family="sans-serif" font-size="12" fill="#cbd5e1">Value: <tspan fill="#34d399" font-weight="700">$3.99</tspan> • Approx. 200 g</text>

    <rect x="25" y="120" width="295" height="40" rx="8" fill="#064e3b" fill-opacity="0.4" />
    <text x="35" y="145" font-family="sans-serif" font-size="11" fill="#6ee7b7">💡 Add paper towel to absorb moisture.</text>

    <rect x="25" y="175" width="190" height="36" rx="10" fill="#059669" />
    <text x="80" y="198" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">✓ Ate This!</text>
    <rect x="225" y="175" width="45" height="36" rx="10" fill="#082f49" />
    <text x="240" y="198" font-family="sans-serif" font-size="14" fill="#38bdf8">❄</text>
    <rect x="278" y="175" width="42" height="36" rx="10" fill="#1e293b" />
    <text x="292" y="198" font-family="sans-serif" font-size="13" fill="#f87171">🗑</text>

    <!-- Card 2: Chicken Breasts -->
    <rect x="365" y="0" width="345" height="230" rx="18" fill="url(#cardGrad)" stroke="#ef4444" stroke-opacity="0.7" stroke-width="1.5" />
    <text x="390" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Chicken Breasts</text>
    <text x="390" y="62" font-family="sans-serif" font-size="12" fill="#94a3b8">2 fillets • ❄️ fridge</text>
    <rect x="585" y="22" width="105" height="24" rx="12" fill="#450a0a" stroke="#dc2626" stroke-width="1" />
    <text x="595" y="38" font-family="sans-serif" font-size="10" font-weight="700" fill="#fca5a5">Expires Tomorrow</text>

    <rect x="390" y="80" width="295" height="30" rx="8" fill="#0f172a" />
    <text x="400" y="100" font-family="sans-serif" font-size="12" fill="#cbd5e1">Value: <tspan fill="#34d399" font-weight="700">$8.99</tspan> • Approx. 680 g</text>

    <rect x="390" y="120" width="295" height="40" rx="8" fill="#064e3b" fill-opacity="0.4" />
    <text x="400" y="145" font-family="sans-serif" font-size="11" fill="#6ee7b7">💡 Cook tonight or move to freezer immediately.</text>

    <rect x="390" y="175" width="190" height="36" rx="10" fill="#059669" />
    <text x="445" y="198" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">✓ Ate This!</text>
    <rect x="590" y="175" width="45" height="36" rx="10" fill="#082f49" />
    <text x="605" y="198" font-family="sans-serif" font-size="14" fill="#38bdf8">❄</text>
    <rect x="643" y="175" width="42" height="36" rx="10" fill="#1e293b" />
    <text x="657" y="198" font-family="sans-serif" font-size="13" fill="#f87171">🗑</text>

    <!-- Card 3: Fresh Eggs -->
    <rect x="730" y="0" width="345" height="230" rx="18" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="755" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Pasture-Raised Eggs</text>
    <text x="755" y="62" font-family="sans-serif" font-size="12" fill="#94a3b8">8 eggs • ❄️ fridge</text>
    <rect x="970" y="22" width="85" height="24" rx="12" fill="#064e3b" />
    <text x="982" y="38" font-family="sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">Fresh (16d)</text>

    <rect x="755" y="80" width="295" height="30" rx="8" fill="#0f172a" />
    <text x="765" y="100" font-family="sans-serif" font-size="12" fill="#cbd5e1">Value: <tspan fill="#34d399" font-weight="700">$5.49</tspan> • Approx. 400 g</text>

    <rect x="755" y="120" width="295" height="40" rx="8" fill="#064e3b" fill-opacity="0.4" />
    <text x="765" y="145" font-family="sans-serif" font-size="11" fill="#6ee7b7">💡 Store pointed end down in original carton.</text>

    <rect x="755" y="175" width="190" height="36" rx="10" fill="#059669" />
    <text x="810" y="198" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">✓ Ate This!</text>
    <rect x="955" y="175" width="45" height="36" rx="10" fill="#082f49" />
    <text x="970" y="198" font-family="sans-serif" font-size="14" fill="#38bdf8">❄</text>
    <rect x="1008" y="175" width="42" height="36" rx="10" fill="#1e293b" />
    <text x="1022" y="198" font-family="sans-serif" font-size="13" fill="#f87171">🗑</text>
  </g>

  <!-- Standout Banner at bottom -->
  <rect x="60" y="550" width="1080" height="180" rx="20" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5" />
  <circle cx="110" cy="640" r="30" fill="#f59e0b" fill-opacity="0.2" />
  <text x="100" y="648" font-size="24" fill="#f59e0b">👨‍🍳</text>
  <text x="160" y="615" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#ffffff">Standout Feature: Cook-First Suggestions</text>
  <text x="160" y="645" font-family="sans-serif" font-size="14" fill="#94a3b8">You have 4 groceries expiring within 72 hours. Our algorithm ranked 6 dinner options using Baby Spinach &amp; Chicken Breasts.</text>
  <rect x="160" y="665" width="220" height="40" rx="10" fill="#f59e0b" />
  <text x="185" y="690" font-family="sans-serif" font-weight="800" font-size="14" fill="#0f172a">Open Cook-First Studio →</text>
</svg>
