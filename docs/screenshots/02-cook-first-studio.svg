<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="50" cy="35" r="16" fill="#059669" />
  <text x="76" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#ffffff">Expiry<tspan fill="#10b981">Guard</tspan></text>
  <rect x="420" y="16" width="360" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="445" y="40" font-family="sans-serif" font-size="13" fill="#94a3b8">Overview</text>
  <text x="540" y="40" font-family="sans-serif" font-size="13" fill="#94a3b8">Kitchen Stock</text>
  <rect x="645" y="20" width="105" height="30" rx="8" fill="#334155" />
  <text x="660" y="40" font-family="sans-serif" font-weight="700" font-size="13" fill="#f59e0b">Cook-First</text>

  <!-- Alert Banner -->
  <rect x="60" y="95" width="1080" height="85" rx="18" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="105" cy="137" r="22" fill="#f59e0b" fill-opacity="0.2" />
  <text x="96" y="145" font-size="20">🔥</text>
  <text x="145" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff">Cook-First Rescue Studio — 4 Urgent Items Detected</text>
  <text x="145" y="155" font-family="sans-serif" font-size="13" fill="#cbd5e1">Recipes sorted by how many groceries reaching spoilage (&lt;72h) they successfully consume.</text>

  <!-- 2 Column Layout -->
  <!-- Left: Recipe List -->
  <g transform="translate(60, 205)">
    <!-- Recipe 1 Selected: Skillet Frittata -->
    <rect x="0" y="0" width="440" height="160" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" />
    <text x="25" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Zero-Waste Skillet Frittata</text>
    <rect x="340" y="20" width="80" height="24" rx="8" fill="#064e3b" />
    <text x="350" y="36" font-family="sans-serif" font-weight="800" font-size="11" fill="#34d399">92% Match</text>
    <text x="25" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">The ultimate hero dish: whisk eggs with wilting spinach, peppers &amp; cheese.</text>
    <text x="25" y="95" font-family="sans-serif" font-size="12" fill="#cbd5e1">⏱ 18 mins • 👥 3 servings • Easy</text>
    <rect x="25" y="115" width="390" height="30" rx="8" fill="#450a0a" fill-opacity="0.4" />
    <text x="35" y="135" font-family="sans-serif" font-size="11" font-weight="700" fill="#fca5a5">🔥 Rescues: Baby Spinach + Pasture-Raised Eggs</text>

    <!-- Recipe 2: Stir-Fry -->
    <rect x="0" y="180" width="440" height="160" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="25" y="218" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Crispy Veggie &amp; Protein Stir-Fry</text>
    <rect x="340" y="200" width="80" height="24" rx="8" fill="#064e3b" />
    <text x="350" y="216" font-family="sans-serif" font-weight="800" font-size="11" fill="#34d399">85% Match</text>
    <text x="25" y="245" font-family="sans-serif" font-size="12" fill="#94a3b8">High-heat wok toss that revives crisper veggies and sears chicken in minutes.</text>
    <text x="25" y="275" font-family="sans-serif" font-size="12" fill="#cbd5e1">⏱ 15 mins • 👥 2 servings • Easy</text>
    <rect x="25" y="295" width="390" height="30" rx="8" fill="#450a0a" fill-opacity="0.4" />
    <text x="35" y="315" font-family="sans-serif" font-size="11" font-weight="700" fill="#fca5a5">🔥 Rescues: Chicken Breasts + Bell Peppers</text>

    <!-- Recipe 3: Pasta -->
    <rect x="0" y="360" width="440" height="160" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="25" y="398" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Creamy Herb Salmon Tagliatelle</text>
    <rect x="340" y="380" width="80" height="24" rx="8" fill="#78350f" />
    <text x="350" y="396" font-family="sans-serif" font-weight="800" font-size="11" fill="#fde68a">74% Match</text>
    <text x="25" y="425" font-family="sans-serif" font-size="12" fill="#94a3b8">Transform expiring heavy cream and greens into bistro pasta in 20 min.</text>
    <text x="25" y="455" font-family="sans-serif" font-size="12" fill="#cbd5e1">⏱ 20 mins • 👥 2 servings • Medium</text>
    <rect x="25" y="475" width="390" height="30" rx="8" fill="#450a0a" fill-opacity="0.4" />
    <text x="35" y="495" font-family="sans-serif" font-size="11" font-weight="700" fill="#fca5a5">🔥 Rescues: Heavy Cream + Baby Spinach</text>
  </g>

  <!-- Right: Recipe Cooking Detail -->
  <g transform="translate(530, 205)">
    <rect x="0" y="0" width="610" height="520" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    
    <text x="35" y="45" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">EASY RECIPE • 18 MINUTES</text>
    <text x="35" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#ffffff">Zero-Waste Skillet Frittata</text>

    <!-- Ingredients Box -->
    <rect x="35" y="115" width="540" height="130" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="55" y="145" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">From Your Kitchen (3/4 matched):</text>
    <text x="55" y="175" font-family="sans-serif" font-size="12" fill="#34d399">✓ Baby Spinach (Urgent! Expires tomorrow)</text>
    <text x="55" y="198" font-family="sans-serif" font-size="12" fill="#34d399">✓ Pasture-Raised Eggs (Available in fridge)</text>
    <text x="55" y="221" font-family="sans-serif" font-size="12" fill="#34d399">✓ Cheddar Cheese Block (Available in fridge)</text>

    <text x="350" y="145" font-family="sans-serif" font-size="13" font-weight="800" fill="#94a3b8">Pantry Staples Needed:</text>
    <text x="350" y="175" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Olive oil (1 tbsp)</text>
    <text x="350" y="198" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Salt &amp; black pepper</text>
    <text x="350" y="221" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Garlic powder</text>

    <!-- Steps -->
    <text x="35" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff">Cooking Walkthrough:</text>
    
    <text x="35" y="315" font-family="sans-serif" font-size="13" fill="#cbd5e1">1. Sauté wilting baby spinach &amp; peppers in olive oil for 3 mins until soft.</text>
    <text x="35" y="350" font-family="sans-serif" font-size="13" fill="#cbd5e1">2. Whisk 4 eggs with salt, pepper, and a splash of milk.</text>
    <text x="35" y="385" font-family="sans-serif" font-size="13" fill="#cbd5e1">3. Pour egg mixture over greens, fold in grated cheddar cheese.</text>
    <text x="35" y="420" font-family="sans-serif" font-size="13" fill="#cbd5e1">4. Cook undisturbed for 8 mins until golden and set.</text>

    <!-- Batch Consume Action -->
    <rect x="35" y="445" width="540" height="50" rx="12" fill="#059669" />
    <text x="180" y="476" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffffff">🎉 I Cooked This Tonight! (Rescues 3 Items)</text>
  </g>
</svg>
