<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- Grid Decoration Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="640" />
    <line x1="240" y1="0" x2="240" y2="640" />
    <line x1="400" y1="0" x2="400" y2="640" />
    <line x1="560" y1="0" x2="560" y2="640" />
    <line x1="720" y1="0" x2="720" y2="640" />
    <line x1="880" y1="0" x2="880" y2="640" />
    <line x1="1040" y1="0" x2="1040" y2="640" />
    <line x1="1200" y1="0" x2="1200" y2="640" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
  </g>

  <!-- Brand Shield Logo Mark -->
  <g transform="translate(100, 100) scale(1.1)">
    <path d="M50 12 L82 24 C82 56 68 76 50 88 C32 76 18 56 18 24 Z" fill="url(#shieldGrad)" />
    <path d="M50 17 L78 27.5 C78 54 65.5 72 50 83 C34.5 72 22 54 22 27.5 Z" fill="#064e3b" opacity="0.35" />
    <path d="M50 36 C50 36 62 40 62 54 C62 64 54 70 50 70 C46 70 38 64 38 54 C38 40 50 36 50 36 Z" fill="url(#leafGrad)" />
    <path d="M50 44 L50 68" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="68" cy="28" r="5" fill="#f59e0b" />
  </g>

  <!-- Title & Tagline -->
  <text x="230" y="165" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="56" fill="#ffffff" letter-spacing="-1">
    Expiry<tspan fill="#34d399">Guard</tspan>
  </text>
  <text x="590" y="145" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="700" font-size="16" fill="#a7f3d0" letter-spacing="1">
    TIER 1 • BEGINNER PORTFOLIO
  </text>

  <text x="100" y="275" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="800" font-size="42" fill="#f8fafc" letter-spacing="-0.5">
    Smart Kitchen Stock &amp; Cook-First Waste Avoidance
  </text>

  <text x="100" y="325" font-family="Inter, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
    Zero-friction shelf-life presets paired with a proactive culinary rescue engine.
  </text>

  <!-- Metric Badges -->
  <g transform="translate(100, 380)">
    <!-- Badge 1: Cook-First -->
    <rect x="0" y="0" width="240" height="90" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="20" y="36" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#a7f3d0">FEATURE</text>
    <text x="20" y="66" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Cook-First Matcher</text>

    <!-- Badge 2: Waste Avoided -->
    <rect x="260" y="0" width="240" height="90" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="280" y="36" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#34d399">QUANTIFIED ROI</text>
    <text x="280" y="66" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Waste Tracker ($ &amp; CO₂)</text>

    <!-- Badge 3: Test Coverage -->
    <rect x="520" y="0" width="240" height="90" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="540" y="36" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">QUALITY GATE</text>
    <text x="540" y="66" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="20" font-weight="800" fill="#ffffff">17 / 17 Unit Tests</text>

    <!-- Badge 4: Tech Stack -->
    <rect x="780" y="0" width="280" height="90" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="800" y="36" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#f59e0b">TECH STACK</text>
    <text x="800" y="66" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="20" font-weight="800" fill="#ffffff">React 19 • TS • Tailwind</text>
  </g>

  <!-- Bottom Details Bar -->
  <text x="100" y="555" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748b">
    Published by <tspan fill="#e2e8f0">github.com/ahmadijaz687</tspan> • Offline-First Client Architecture
  </text>
</svg>
